name: Build & Release Zepp OS App

on:
  workflow_dispatch: # Allows manual trigger from browser
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build ZeppHello Package by Stealth Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install || npm install --legacy-peer-deps

      - name: Install Zeus CLI
        run: npm install -g @zeppos/zeus-cli

      - name: Build Zepp OS Package (.zab)
        run: |
          zeus build
          ls -lh dist/
          cd dist
          ZAB_FILE=$(ls *.zab 2>/dev/null | head -n 1)
          if [ -n "$ZAB_FILE" ] && [ -f "$ZAB_FILE" ]; then
            echo "Processing $ZAB_FILE..."
            cp "$ZAB_FILE" zepphello.zab
            mkdir -p extracted_zab
            unzip -o "$ZAB_FILE" -d extracted_zab || true
            ZPK_FOUND=$(find extracted_zab -name "*.zpk" | head -n 1)
            if [ -n "$ZPK_FOUND" ]; then
              cp "$ZPK_FOUND" zepphello.zpk
              echo "Created zepphello.zpk from $ZPK_FOUND"
            fi
          fi
          cd ..
          ls -lh dist/

      - name: Generate QR Code & Job Summary
        run: |
          node scripts/generate-qr.js

      - name: Upload Build Artifacts (.zab, .zpk, and QR codes)
        uses: actions/upload-artifact@v4
        with:
          name: zepp-os-zepphello
          path: |
            dist/*.zab
            dist/*.zpk
            dist/*.png

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ZeppHello Template v1.0.0 by Stealth Apps"
          body: |
            ## ⌚ ZeppHello — Zepp OS Template by Stealth Apps
            
            Zepp OS 3.0 / 2.x Mini-App template for Amazfit smartwatches (Round 466x466 AMOLED).
            
            ### 📱 Install via Zepp App Developer Mode:
            Scan the QR code shown in the GitHub Actions Run Summary or use the `zpkd1://` link:
            `zpkd1://${{ github.server_url }}/${{ github.repository }}/releases/latest/download/zepphello.zab`
          files: |
            dist/zepphello.zab
            dist/zepphello.zpk
            dist/install-qrcode.png
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
